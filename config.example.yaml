# Шаблон конфига. Скопируйте в config.yaml и заполните под себя:
#   cp config.example.yaml config.yaml
# Личный config.yaml в репозиторий не попадает (см. .gitignore).

# ============================================================
# Каналы: username без @ (публичные) или ID вида -100XXXXXXXXXX
# (приватные, в которых вы состоите; ID покажет бот @getidsbot,
# если переслать ему любой пост из канала)
# ============================================================
channels:
  - rbc_news
  - centralbank_russia
  - if_market_news

# ============================================================
# Профиль: главный "код" всей системы. Модель оценивает каждую
# тему через вопрос "влияет ли это на решения ЭТОГО человека
# в ближайшие 1-3 месяца". Чем конкретнее, тем лучше фильтрация.
# ============================================================
profile: |
  Кто вы: город, семья, профессия и индустрия, куда движетесь в карьере.
  Активы и обязательства: ипотека, вклады, инвестиции, свой бизнес.

  Значимо (влияет на мои решения в ближайшие 1-3 месяца):
  - например: ключевая ставка ЦБ, инфляция, курс рубля
  - например: налоги и льготы для моей ситуации
  - например: новости моей индустрии и инструментов, которыми работаю

  Шум (выкидывать, даже если "громко"):
  - например: спорт, шоу-бизнес, происшествия, криминал
  - например: заявления политиков без конкретных последствий

# ============================================================
# Доставка: "me" это Избранное. Для канала укажите его username
# без @ (публичный) или ID вида -100XXXXXXXXXX (приватный, ID
# покажет @getidsbot). Постит ваш аккаунт, он должен быть
# владельцем или админом канала с правом публикаций.
# Ошибки пайплайна всегда приходят в Избранное.
# ============================================================
target: me

# ============================================================
# Модель и лимиты
# ============================================================
model: deepseek-chat
hours_lookback: 24      # за сколько часов собирать посты
max_post_chars: 800     # обрезка длинных постов, экономит токены

# ============================================================
# Пороги отбора (score от 0 до 10, который ставит модель)
# ============================================================
main_threshold: 6       # с какого балла тема становится "Главным"
worth_threshold: 4      # с какого балла тема попадает в "Стоит знать"
max_worth_items: 3      # максимум строк в "Стоит знать"

# Режим калибровки: в конце дайджеста показывать отфильтрованные
# темы одной строкой. Держите включённым первую неделю-две, правьте
# профиль по результатам, потом выключите и читайте только выжимку.
calibration: true

# ============================================================
# Фильтр рекламы: регулярки, пост с совпадением выкидывается
# до отправки в модель
# ============================================================
ad_patterns:
  - '\berid\b'
  - 'erid[:=]'
  - '#реклама'
  - '#промо'
  - 'на правах рекламы'
  - 'партн[её]рск(ий|ая|ое) (пост|материал|интеграция)'
  - 'промокод'
  - 'реклама\.\s'
